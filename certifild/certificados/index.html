<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Consulte certificados e laudos técnicos publicados pelo LDA CyberWatch." />
    <meta name="theme-color" content="#070b12" />

    <title>Certificados Emitidos - LDA CyberWatch</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../../src/css/style.css" />
  </head>

  <body class="bg-dark text-light">
    <main class="container my-5" aria-labelledby="certificates-title">
      <div id="msgBox" class="mt-3" aria-live="polite"></div>
      <header class="mb-4 border-bottom pb-3">
        <p class="eyebrow">REGISTROS / CERTIFICAÇÃO</p>
        <h1 id="certificates-title" class="h3 neon-text">Certificados emitidos</h1>
        <p class="subtitulo">Consulta de registros técnicos retornados pelo serviço de certificados.</p>
      </header>

      <div class="card card-futuristic border-0">
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="searchInput" class="form-label">Pesquisar certificados</label>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Pesquisar por ID, empresa ou sistema..."
              />
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <caption class="visually-hidden">Certificados emitidos com identificador, empresa, sistema, capacidade e data</caption>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Empresa</th>
                  <th scope="col">Sistema</th>
                  <th scope="col">Capacidade</th>
                  <th scope="col">Data</th>
                </tr>
              </thead>
              <tbody id="certTableBody">
                <tr>
                  <td colspan="5" class="text-center">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="../../src/components/site-shell.js"></script>
    <script type="module" src="../../src/js/certificados.js"></script>
  </body>
</html>
